<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title description">
  <title id="title">Learning with limited labels</title>
  <desc id="description">Semi-supervision · Uncertainty · Calibration.</desc>
  <style>
    .flow { stroke-dasharray: 4 8; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    .label { fill-opacity: 0; animation: label 6s ease-in-out infinite; }
    .l2 { animation-delay: 2s; } .l3 { animation-delay: 4s; }
    @keyframes label { 15%, 35% { fill-opacity: .9; } 55% { fill-opacity: 0; } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 24s linear infinite; }
    @keyframes ring { to { transform: rotate(360deg); } }
    @media (max-width: 600px) {
      .theme-title { font-size: 52px; transform: translateY(40px); }
      .theme-number { font-size: 28px; transform: translateY(22px); }
      .theme-description { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x2="1" y2=".5"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f0f5fa"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6f52d4" stop-opacity=".10"/><stop offset="1" stop-color="#6f52d4" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x2="0" y2="1"><stop stop-color="#6f52d4" stop-opacity="0"/><stop offset=".5" stop-color="#6f52d4"/><stop offset="1" stop-color="#6f52d4" stop-opacity="0"/></linearGradient>
    <linearGradient id="scanfade" x2="0" y2="1"><stop stop-color="#6f52d4" stop-opacity="0"/><stop offset="1" stop-color="#6f52d4" stop-opacity=".22"/></linearGradient>
    <clipPath id="frame"><rect x=".5" y=".5" width="1199" height="219" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="220" fill="url(#bg)"/>
    <ellipse cx="1016" cy="110" rx="250" ry="200" fill="url(#glow)"/>
    <path d="M0 32V188" stroke="#6f52d4" stroke-width="6"/>
    <path d="M832 25V195" stroke="url(#accent)" stroke-opacity=".3"/>
    <g transform="translate(1016 110)" color="#6f52d4" fill="none">
      <path d="M-66-40L-15-58 55-35 72 28 5 59-68 31ZM-66-40L5 59 55-35-68 31-15-58 72 28-66-40" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/>
      <g fill="currentColor"><circle cx="-15" cy="-58" r="7"/><circle cx="72" cy="28" r="7"/><circle cx="-68" cy="31" r="7"/></g>
      <g stroke="currentColor" stroke-width="2" fill="currentColor"><circle class="label" cx="-66" cy="-40" r="8"/><circle class="label l2" cx="55" cy="-35" r="8"/><circle class="label l3" cx="5" cy="59" r="8"/></g>
      <circle class="ring" r="22" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-dasharray="3 5"/>
      <circle r="5" fill="currentColor"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <text class="theme-number" x="40" y="51" fill="#6f52d4" font-size="21" letter-spacing="3">02 / FOCUS</text>
      <text class="theme-title" x="38" y="116" fill="#0f1b2d" font-size="44" font-weight="700" letter-spacing="-1">Learning with limited labels</text>
      <text class="theme-description" x="40" y="169" fill="#46566d" font-size="26">Semi-supervision · Uncertainty · Calibration</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="219" rx="18" fill="none" stroke="#6b83a5" stroke-opacity=".22"/>
</svg>
